services:
  mercheck:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-amoszp}/mercheck:${MERCHECK_TAG:-latest}
    container_name: mercheck
    restart: unless-stopped
    ports:
      - "1102:4480"
    env_file:
      - ./server/.env
    volumes:
      # Host-side folder that keeps the SQLite database across updates.
      - ./data:/app/server/data
    networks:
      - default
      - accounts

networks:
  accounts:
    # Created by the accounts service's compose file.
    external: true
